name: medisync
description: "A Digital Health Passport built with Flutter."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
#file_picker: ^11.0.2
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^22.0.1
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10+1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  riverpod_generator: ^2.6.4
  freezed: ^2.5.7
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/